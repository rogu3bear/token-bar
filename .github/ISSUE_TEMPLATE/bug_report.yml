name: Bug report
description: Report an observable problem without private data.
title: ""
body:
  - type: markdown
    attributes:
      value: "Do not include email addresses, account IDs, credentials, private task names, or raw logs. For private contact email, use the app's Feedback button."
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include expected behavior and steps to reproduce.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version and macOS version
  - type: input
    id: reference
    attributes:
      label: Private feedback reference (optional)
      description: An opaque reference from the feedback form, never your email.
