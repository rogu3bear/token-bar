name: Report or suggestion
description: Report a problem or suggest an improvement without private data.
title: ""
body:
  - type: markdown
    attributes:
      value: "This issue will be public. Do not include email addresses, account IDs, credentials, private task names, or raw logs."
  - type: textarea
    id: behavior
    attributes:
      label: Report
      description: Describe your suggestion, or include what happened, expected behavior and steps to reproduce.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version (optional)
  - type: input
    id: macos
    attributes:
      label: macOS version (optional)
